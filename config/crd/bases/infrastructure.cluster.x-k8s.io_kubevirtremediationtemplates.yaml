kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: kubevirtremediationtemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: KubevirtRemediationTemplate
    listKind: KubevirtRemediationTemplateList
    plural: kubevirtremediationtemplates
    shortNames:
    - kvrt
    singular: kubevirtremediationtemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubevirtRemediationTemplate is the Schema for the kubevirtremediationtemplates API.
          Reference it from MachineHealthCheck spec.remediation.templateRef to have
          unhealthy Machines restarted instead of deleted.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubevirtRemediationTemplateSpec defines the desired state
              of KubevirtRemediationTemplate.
            properties:
              template:
                description: |-
                  KubevirtRemediationTemplateResource describes the data needed to create a
                  KubevirtRemediation from a template.
                properties:
                  spec:
                    description: spec is the specification of the desired behavior
                      of the KubevirtRemediation.
                    properties:
                      strategy:
                        description: strategy field defines the remediation strategy.
                        properties:
                          retryLimit:
                            default: 1
                            description: |-
                              retryLimit sets the maximum number of restarts to attempt before
                              handing the Machine back to Cluster API for replacement.
                            format: int32
                            minimum: 1
                            type: integer
                          timeoutSeconds:
                            default: 600
                            description: |-
                              timeoutSeconds is how long to wait after a restart for the node to
                              become healthy before retrying or giving up. The Machine is considered
                              healthy again when the MachineHealthCheck deletes this remediation
                              object, so the timeout only has to outlast a normal boot.
                            format: int32
                            minimum: 60
                            type: integer
                          type:
                            default: Reboot
                            description: type of remediation. Only Reboot is supported.
                            enum:
                            - Reboot
                            type: string
                        type: object
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
